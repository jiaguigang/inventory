 let diff='';if(ph&&ph.t){const d=s.t-ph.t,p=d/ph.t*100;diff=`<div style="font-size:13px;margin-top:4px">與 ${lab(pk)} 相比 <b class="${d>0?'up':'dn'}">${d>0?'+':''}${money(d)}（${p>0?'+':''}${p.toFixed(1)}%）</b></div>`}
 const all=[...keys.filter(k=>k!==cur).map(k=>[k,S.hist[k]]),[cur,{f:s.f,p:s.p,c:s.c,t:s.t,live:1}]];
 const mx=Math.max(...all.map(a=>a[1].t),1);
 const locs=Object.entries(s.loc).sort((a,b)=>b[1]-a[1]);
 const top=[...S.items].filter(i=>tot(i)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,10);
 return `<div class="card"><h2>${lab(cur)} 分類統計</h2>${Object.keys(CATS).map(k=>bar(CATS[k],s[k],s.t,COL[k])).join('')}${diff}</div>
 <div class="card"><h2>各區域</h2>${locs.length?locs.map(l=>bar(l[0],l[1],s.t,'var(--ac)')).join(''):'<div class="empty">尚未盤點</div>'}</div>
 <div class="card"><h2>歷月趨勢（食材／包材／清潔）</h2><div class="hist">${all.map(([k,h])=>{const nb=!h.p&&!h.c;const sc=v=>(v/mx*100)+'%';return `<div class="col"><div class="stack" style="${h.live?'opacity:.55':''}"><i style="height:${sc(h.f)};background:${nb?'var(--g)':COL.f}"></i><i style="height:${sc(h.p)};background:${COL.p}"></i><i style="height:${sc(h.c)};background:${COL.c}"></i></div>${(h.t/10000).toFixed(1)}萬<br>${k.slice(2).replace('-','/')}</div>`}).join('')}</div><div style="font-size:11px;color:var(--mu);margin-top:6px">灰色＝當時未分類；半透明＝本月進行中</div></div>
 ${usageCard()}<div class="card"><h2>成本最高的 10 項</h2>${top.length?top.map(i=>bar(i.name,tot(i),s.t,COL[i.cat])).join(''):'<div class="empty">尚未盤點</div>'}</div>`}
function vItems(){return `<button class="btn" data-a="new">＋ 新增品項</button>`+S.items.map(i=>`<div class="row" data-id="${i.id}" data-a="e"><div class="nm"><b>${esc(i.name)}</b><small>${CATS[i.cat]} · ${esc(i.loc)} · ${m1(i.cost)}/${esc(i.unit)}</small></div><div class="rt">›</div></div>`).join('')}
function vMore(){const ks=Object.keys(S.hist).sort().reverse();return `<div class="card"><h2>月底作業</h2><div class="f"><label>盤點月份</label><input type="month" id="mm" value="${cur}"></div>
 <button class="btn" data-a="arch">封存這個月的結果</button>
 <button class="btn alt" data-a="rst">清空所有數量（開始下個月盤點）</button></div>
 <div class="card"><h2>資料</h2><button class="btn alt" data-a="pull">重新讀取最新資料</button><button class="btn alt" data-a="csv">匯出目前盤點 CSV</button><button class="btn alt" data-a="seed">匯入起始品項與歷史月份</button>
 <div style="font-size:12px;color:var(--mu)">${online()?'已連線雲端資料庫，現場與你的手機共用同一份資料。':'尚未設定雲端資料庫，目前只存在這支手機。'}</div></div>
 <div class="card"><h2>現場人員專用連結</h2><div style="font-size:13px;word-break:break-all">${esc(location.href.split('#')[0])}#staff</div><div style="font-size:12px;color:var(--mu);margin-top:6px">只能填數量，看不到價格與統計。</div></div>
 <div class="card"><h2>已封存月份</h2>${ks.length?ks.map(k=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${lab(k)}</span><b>${money(S.hist[k].t)}</b></div>`).join(''):'<div class="empty">還沒有</div>'}</div>`}
function render(){header();tabs();$('#main').innerHTML={count:vCount,stats:vStats,items:vItems,more:vMore}[tab]()}
function upd(row){const i=S.items.find(x=>x.id===row.dataset.id);if(!STAFF)row.querySelector('.rt').textContent=money(tot(i));markDone(i);row.classList.add('ok');header();saveQty(i)}
function setQty(row,v){const i=S.items.find(x=>x.id===row.dataset.id);i.qty=Math.max(0,Math.round(v*100)/100);row.querySelector('input').value=i.qty||'';upd(row)}
function arm(b,fn){if(b._a){fn();return}b._a=1;const t=b.textContent;b.textContent='再按一次確認';setTimeout(()=>{b._a=0;b.textContent=t},3000)}
function edit(id){const i=S.items.find(x=>x.id===id)||{cat:'f',loc:'煎台',unit:'包',cost:0,freq:'m'};const ls=[...new Set([...LOCS,...S.items.map(x=>x.loc)])];
 $('#md').innerHTML=`<div class="sheet"><h2 style="margin:0 0 10px">${id?'編輯品項':'新增品項'}</h2>
 <div class="f"><label>品項名稱</label><input id="e_n" value="${esc(i.name||'')}"></div>
 <div class="two f"><div><label>類別</label><select id="e_c">${Object.keys(CATS).map(k=>`<option value="${k}" ${i.cat===k?'selected':''}>${CATS[k]}</option>`).join('')}</select></div>
 <div><label>位置</label><select id="e_l">${ls.map(l=>`<option ${i.loc===l?'selected':''}>${esc(l)}</option>`).join('')}</select></div></div>
 <div class="two f"><div><label>單位</label><input id="e_u" value="${esc(i.unit)}"></div><div><label>單價（元）</label><input id="e_p" type="number" inputmode="decimal" step="any" value="${i.cost}"></div></div>
 <div class="f"><label>盤點頻率</label><select id="e_q">${[['m','每月'],['w','每週'],['d','每日']].map(([k,t])=>`<option value="${k}" ${(i.freq||'m')===k?'selected':''}>${t}</option>`).join('')}</select></div>
 <div class="f"><label>備註（舊食材可把單價設為 0）</label><input id="e_o" value="${esc(i.note||'')}"></div>
 <button class="btn" data-a="es" data-id="${id||''}">儲存</button>${id?`<button class="btn red" data-a="ed" data-id="${id}">刪除品項</button>`:''}<button class="btn alt" data-a="ec">取消</button></div>`;$('#md').classList.add('on')}
function seed(){let n=0;const have=new Set(S.items.map(i=>i.name));SEED.split('\n').forEach((l,k)=>{const [name,cat,loc,unit,cost]=l.split('|');if(!have.has(name)){S.items.push({id:'s'+k,name,cat,loc,unit,cost:+cost,qty:0});n++}});
 Object.entries(HIST).forEach(([k,v])=>{if(!S.hist[k])S.hist[k]={f:v[0],p:v[1],c:v[2],t:v[0]+v[1]+v[2]}});syncSeed();toast(`已匯入 ${n} 項`);render()}
async function csv(){const r=[['位置','類別','品項','數量','單位','單價','小計','備註'],...S.items.filter(i=>i.qty).map(i=>[i.loc,CATS[i.cat],i.name,i.qty,i.unit,i.cost,tot(i),i.note||''])];
 const t='\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'庫存'+cur+'.csv',data:t});toast('已匯出')}catch(e){toast('此環境無法下載')}}
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-t]');if(tb){tab=tb.dataset.t;render();scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,row=el.closest('.row');
 if(a==='m')setQty(row,(+row.querySelector('input').value||0)-1);
 else if(a==='p')setQty(row,(+row.querySelector('input').value||0)+1);
 else if(a==='e')edit(row?.dataset.id);
 else if(a==='new')edit(null);
 else if(a==='fq'){fq=el.dataset.v;render()}
 else if(a==='ok'){const i=S.items.find(x=>x.id===row.dataset.id);markDone(i);row.classList.add('ok');saveQty(i);header()}
 else if(a==='fl'){fl=el.dataset.v;render()}else if(a==='fc'){fc=el.dataset.v;render()}
 else if(a==='pull')pull(true);
 else if(a==='seed')seed();
 else if(a==='csv')csv();
 else if(a==='ec')$('#md').classList.remove('on');
 else if(a==='es'){const id=el.dataset.id,n=$('#e_n').value.trim();if(!n){toast('請輸入名稱');return}
  const v={name:n,cat:$('#e_c').value,loc:$('#e_l').value,unit:$('#e_u').value.trim()||'個',cost:+$('#e_p').value||0,note:$('#e_o').value.trim(),freq:$('#e_q').value};
  let it;if(id){it=S.items.find(x=>x.id===id);Object.assign(it,v)}else{it={id:'n'+Date.now(),qty:0,...v};S.items.push(it)}
  syncItem(it);$('#md').classList.remove('on');render()}
 else if(a==='ed')arm(el,()=>{const did=el.dataset.id;S.items=S.items.filter(x=>x.id!==did);syncDel(did);$('#md').classList.remove('on');render()});
 else if(a==='arch'){const s=sums();S.hist[cur]={f:s.f,p:s.p,c:s.c,t:s.t,snap:Object.fromEntries(S.items.filter(i=>i.qty).map(i=>[i.id,i.qty]))};syncHist(cur);toast('已封存 '+lab(cur)+'：'+money(s.t));render()}
 else if(a==='rst')arm(el,()=>{S.items.forEach(i=>{i.qty=0;i.counted=null});syncReset();toast('數量已清空');render()});
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){q=e.target.value.trim();$('#list').innerHTML=rows()}
 else if(e.target.closest('.st')){const row=e.target.closest('.row');const i=S.items.find(x=>x.id===row.dataset.id);i.qty=+e.target.value||0;upd(row)}
 else if(e.target.id==='mm'&&e.target.value){cur=e.target.value;header()}
});
$('#md').addEventListener('click',e=>{if(e.target.id==='md')$('#md').classList.remove('on')});
init();
</script></body></html>
