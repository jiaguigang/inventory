<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>呷歸岡 庫存</title><meta name="theme-color" content="#1f264f">
<style>
:root{--bg:#eef2f7;--card:#ffffff;--tx:#1f264f;--mu:#6b7090;--ac:#d4552f;--ac2:#e3e9f2;--bd:#d5dce8;--f:#d4552f;--p:#3c5bb5;--c:#437f69;--g:#b4bac6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a3a;--card:#1f264f;--tx:#eef2f7;--mu:#a9acc8;--ac2:#2f3a72;--bd:#2f3a72;--p:#8da2e8;--c:#5fb08f}}
:root[data-theme="dark"]{--bg:#141a3a;--card:#1f264f;--tx:#eef2f7;--mu:#a9acc8;--ac2:#2f3a72;--bd:#2f3a72;--p:#8da2e8;--c:#5fb08f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:84px}
#hd{padding:14px 16px 10px;position:relative}.logo{position:absolute;right:14px;top:8px;width:62px;border-radius:12px}#hd h1{margin:0;font-size:13px;color:var(--mu);font-weight:600}
#hd .big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.mini{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}.mini span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:12px}
.mini i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#main{padding:0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 13px;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:9px 10px;margin-bottom:7px}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:600}.nm small{color:var(--mu);font-size:11.5px}
.st,.st2{display:flex;align-items:center;gap:4px}.st input,.st2 input{width:56px;text-align:center;padding:7px 2px}
.st button,.st2 button{width:32px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--ac2);color:var(--tx);font-size:18px}
.okb{width:40px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font-size:16px}.row.ok{border-color:var(--c)}.row.ok .okb{background:var(--c);border-color:var(--c);color:#fff}
.rt{width:62px;text-align:right;font-weight:600;font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:2px 0 8px}.seg button{flex:1 0 auto;min-width:76px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 10px;font:inherit;font-weight:700;font-size:15px}.seg button small{display:block;font-weight:400;font-size:11px;opacity:.75}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.gh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mu);margin:12px 2px 6px}.gh i{width:9px;height:9px;border-radius:50%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--mu);font-weight:600}
.bar{margin:7px 0}.bar div:first-child{display:flex;justify-content:space-between;font-size:13px}
.bar .tr{height:9px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:3px}.bar .tr i{display:block;height:100%;border-radius:6px}
.hist{display:flex;gap:10px;overflow-x:auto;align-items:flex-end;height:170px;padding-top:6px}
.col{flex:none;width:38px;text-align:center;font-size:10.5px;color:var(--mu)}
.stack{height:120px;display:flex;flex-direction:column-reverse;justify-content:flex-start}.stack i{display:block;width:100%}
.up{color:#d2553d}.dn{color:#3f9a64}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;background:var(--ac);color:#fff;margin-bottom:9px}
.btn.alt{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.red{background:#d2553d;color:#fff}
#tb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tb button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 8px;font:inherit;font-size:12px}#tb button b{display:block;font-size:20px;line-height:1.1}
#tb button.on{color:var(--tx);font-weight:700}#tb button.on b{filter:none}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
#md.on{display:flex}#md .sheet{background:var(--bg);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.f{margin-bottom:9px}.f label{font-size:12px;color:var(--mu)}.two{display:flex;gap:8px}.two>*{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f264f;color:#eef2f7;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.sh{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}.sh th{font-size:11.5px;color:var(--mu);font-weight:600;text-align:right;padding:5px 6px;border-bottom:1px solid var(--bd)}.sh td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}.sh th:first-child,.sh td:first-child{text-align:left}.sh td small{display:block;color:var(--mu);font-size:11px;font-weight:400}.sh tr.ok td:last-child small{color:var(--c);font-weight:600}.sh .pr,.prd{display:none}.sh th.mv,.sh td.mv{text-align:center;white-space:nowrap}.mvb{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;font-weight:700;margin:0 2px}.dl{display:block;margin-top:8px;color:var(--mu);font-size:13px}.mvb.ws{color:var(--mu)}.mvb.in{color:var(--c);border-color:var(--c)}.mvb.out{color:var(--ac);border-color:var(--ac)}
@media print{.mv{display:none!important}#tb,.noprint,#hd .big,#hd .mini,.logo,#toast{display:none!important}body{background:#fff;color:#000;padding-bottom:0}.sh,.sh td,.sh th{background:#fff;color:#000}.sh td,.sh th{border:1px solid #888}.sh .pr{display:table-cell;width:72px}.prd{display:block;margin:6px 0 10px;font-size:13px}.gh{break-after:avoid;color:#000}tr{break-inside:avoid}}
.lowrow{border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
</style></head><body>
<div id="hd"></div><div id="main"></div>
<div id="tb"></div><div id="md"></div><div id="toast"></div>

document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-t]');if(tb){tab=tb.dataset.t;render();scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,row=el.closest('.row');
 if(a==='m')setQty(row,(+row.querySelector('input').value||0)-1);
 else if(a==='p')setQty(row,(+row.querySelector('input').value||0)+1);
 else if(a==='e')edit(row?.dataset.id);
 else if(a==='new')edit(null);
 else if(a==='fq'){fq=el.dataset.v;render()}
 else if(a==='ok'){const i=S.items.find(x=>x.id===row.dataset.id);markDone(i);row.classList.add('ok');saveQty(i);header()}
 else if(a==='fl'){fl=el.dataset.v;render()}else if(a==='fc'){fc=el.dataset.v;render()}
 else if(a==='gp'){tab='price';render();scrollTo(0,0)}
 else if(a==='pback'){tab='more';render();scrollTo(0,0)}
 else if(a==='pf'){pf=el.dataset.v;render()}
 else if(a==='oq'){oq=el.dataset.v;render()}
 else if(a==='om')chkQty(row,(+row.querySelector('input').value||0)-1);
 else if(a==='op')chkQty(row,(+row.querySelector('input').value||0)+1);
 else if(a==='otxt'){$('#md').innerHTML=`<div class="sheet"><h2 style="margin:0 0 10px">叫貨單</h2><textarea id="otx" readonly style="width:100%;height:240px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px">${esc(orderText())}</textarea><button class="btn" data-a="ocopy" style="margin-top:9px">複製</button><button class="btn alt" data-a="ec">關閉</button></div>`;$('#md').classList.add('on')}
 else if(a==='ocopy'){const t=$('#otx');t.select();const ok=()=>toast('已複製'),fb=()=>{try{document.execCommand('copy');ok()}catch(x){toast('請長按文字手動複製')}};try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(x){fb()}}
 else if(a==='sf'){sf=el.dataset.v;render()}
 else if(a==='pr')window.print();
 else if(a==='csv2')sheetCsv();
 else if(a==='pull')pull(true);
 else if(a==='seed')seed();
 else if(a==='csv')csv();
 else if(a==='mv'){const i=S.items.find(x=>x.id===el.dataset.id),k=el.dataset.v;aid=i.id;mk=k;const T={in:'進貨',out:'出貨',waste:'損耗／自用'}[k];
  const ext=k==='in'?`<label class="dl">進價（每${esc(i.unit)}，元）</label><input id="apr" type="number" inputmode="decimal" step="any" value="${i.cost}" style="width:100%"><div id="apd" style="font-size:12.5px;color:var(--mu);min-height:18px"></div><label class="dl">廠商</label><input id="asp" list="spl" value="${esc(i.supplier||'')}" style="width:100%"><datalist id="spl">${[...new Set(S.items.map(x=>x.supplier).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist><label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px"><input id="aup" type="checkbox" checked style="width:auto">同時把品項單價改成這個進價</label>`:k==='waste'?`<label class="dl">原因</label><select id="ant" style="width:100%">${['過期／報廢','製作損耗','員工餐','試吃／招待','其他'].map(v=>`<option>${v}</option>`).join('')}</select>`:'';
  $('#md').innerHTML=`<div class="sheet"><h2 style="margin:0 0 4px">${esc(i.name)}　${T}</h2><div style="color:var(--mu);margin-bottom:10px">目前庫存 <b>${i.qty||0}</b> ${esc(i.unit)}。輸入這次${k==='in'?'進了':'用掉／損耗了'}多少：</div><input id="aq" type="number" inputmode="decimal" step="any" placeholder="數量" style="width:100%;font-size:20px;text-align:center"><div id="apv" style="text-align:center;color:var(--mu);margin:6px 0;min-height:20px"></div><label class="dl" style="margin-top:0">日期</label><input id="adt" type="date" value="${today()}" max="${today()}" style="width:100%">${ext}<button class="btn" data-a="${{in:'mvin',out:'mvout',waste:'mvwaste'}[k]}" style="margin-top:10px">確認${T}</button>${k==='out'?'<button class="btn alt" data-a="mvset">改成這個庫存數（校正）</button>':''}<button class="btn alt" data-a="ec">取消</button></div>`;$('#md').classList.add('on');setTimeout(()=>$('#aq').focus(),50)}
 else if(a==='mvin'||a==='mvout'||a==='mvwaste'||a==='mvset'){const i=S.items.find(x=>x.id===aid),v=+$('#aq').value;if(!i||$('#aq').value===''||v<0||(a!=='mvset'&&!v)){toast('請輸入數量');return}
  i.qty=Math.max(0,Math.round((a==='mvset'?v:i.qty+(a==='mvin'?v:-v))*100)/100);i.chk=today();
  if(a!=='mvset'){const kind={mvin:'in',mvout:'out',mvwaste:'waste'}[a],m={id:'m'+Date.now()+Math.random().toString(36).slice(2,5),day:$('#adt').value||today(),item:i.id,kind,q:v,p:i.cost,sp:'',n:''};
   if(kind==='in'){const pr=$('#apr').value===''?i.cost:+$('#apr').value;m.p=pr;m.sp=$('#asp').value.trim();let ch=false;if($('#aup').checked&&pr!==i.cost){i.cost=pr;ch=true}if(m.sp&&!i.supplier){i.supplier=m.sp;ch=true}if(ch)syncItem(i)}
   else if(kind==='waste')m.n=$('#ant').value;
   (S.mv=S.mv||[]).push(m);syncMv(m)}
  saveChk(i);$('#md').classList.remove('on');toast(i.name+' 庫存 '+i.qty+i.unit);render()}
 else if(a==='mvl'){mvList()}
 else if(a==='mvf'){mvf=el.dataset.v;mvList()}
 else if(a==='mvdel'){const m=S.mv.find(x=>x.id===el.dataset.id),i=m&&S.items.find(x=>x.id===m.item);if(!m)return;if(i){i.qty=Math.max(0,Math.round((i.qty+(m.kind==='in'?-m.q:m.q))*100)/100);i.chk=today();saveChk(i)}S.mv=S.mv.filter(x=>x!==m);cache();run(()=>sb('inv_move?id=eq.'+encodeURIComponent(m.id),{method:'DELETE'}));mvList();toast('已刪除，庫存已調回')}
 else if(a==='adj'){const i=S.items.find(x=>x.id===row.dataset.id);aid=i.id;$('#md').innerHTML=`<div class="sheet"><h2 style="margin:0 0 4px">${esc(i.name)}</h2><div style="color:var(--mu);margin-bottom:10px">目前已盤 <b id="acur">${i.qty||0}</b> ${esc(i.unit)}。又找到一批，或要扣掉，輸入這次的數量：</div><input id="aq" type="number" inputmode="decimal" step="any" placeholder="這次數量" style="width:100%;font-size:20px;text-align:center"><div id="apv" style="text-align:center;color:var(--mu);margin:8px 0;min-height:20px"></div><div class="two"><button class="btn" data-a="aadd">＋ 加入</button><button class="btn red" data-a="asub">− 扣除</button></div><button class="btn alt" data-a="ec">取消</button></div>`;$('#md').classList.add('on');setTimeout(()=>$('#aq').focus(),50)}
 else if(a==='aadd'||a==='asub'){const i=S.items.find(x=>x.id===aid),v=+$('#aq').value;if(!i||!v||v<0){toast('請輸入大於 0 的數量');return}i.qty=Math.max(0,Math.round((i.qty+(a==='aadd'?v:-v))*100)/100);markDone(i);saveQty(i);$('#md').classList.remove('on');toast(i.name+' 合計 '+i.qty+i.unit);render()}
 else if(a==='ec')$('#md').classList.remove('on');
 else if(a==='es'){const id=el.dataset.id,n=$('#e_n').value.trim();if(!n){toast('請輸入名稱');return}
  let cat=$('#e_c').value,loc=$('#e_l').value;if(cat==='__new'){const t=$('#e_cn').value.trim();if(!t){toast('請輸入新類別名稱');return}cat=Object.keys(CATS).find(k=>CATS[k]===t)||t}if(loc==='__new'){loc=$('#e_ln').value.trim();if(!loc){toast('請輸入新位置名稱');return}}
  const v={name:n,cat,loc,unit:$('#e_u').value.trim()||'個',cost:+$('#e_p').value||0,note:$('#e_o').value.trim(),supplier:$('#e_s').value.trim(),safe:+$('#e_sf').value||0,par:+$('#e_pr').value||0,freq:$('#e_q').value};
  let it;if(id){it=S.items.find(x=>x.id===id);Object.assign(it,v)}else{it={id:'n'+Date.now(),qty:0,...v};S.items.push(it);fl='全部';fc='全部';fq='all'}
  syncItem(it);$('#md').classList.remove('on');render()}
 else if(a==='ed')arm(el,()=>{const did=el.dataset.id;S.items=S.items.filter(x=>x.id!==did);syncDel(did);$('#md').classList.remove('on');render()});
 else if(a==='arch'){const s=sums();S.hist[cur]={f:s.f,p:s.p,c:s.c,t:s.t,snap:Object.fromEntries(S.items.filter(i=>i.qty).map(i=>[i.id,i.qty])),prices:Object.fromEntries(S.items.map(i=>[i.id,i.cost]))};syncHist(cur);toast('已封存 '+lab(cur)+'：'+money(s.t));render()}
 else if(a==='rst')arm(el,()=>{S.items.forEach(i=>{i.qty=0;i.counted=null;i.chk=null});syncReset();toast('數量已清空');render()});
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){q=e.target.value.trim();$('#list').innerHTML=rows()}
 else if(e.target.closest('.st2')){const row=e.target.closest('.row'),i=S.items.find(x=>x.id===row.dataset.id);i.qty=+e.target.value||0;i.chk=today();chkAfter(row,i)}
 else if(e.target.classList.contains('pin')){const row=e.target.closest('.row'),i=S.items.find(x=>x.id===row.dataset.id);i.cost=+e.target.value||0;row.querySelector('.rt').innerHTML=diffTag(i);header();savePrice(i)}
 else if(e.target.id==='rv'){S.rev=S.rev||{};S.rev[cur]=+e.target.value||0;$('#rvres').innerHTML=rateRes();cache();clearTimeout(rvT);rvT=setTimeout(()=>run(()=>sb('inv_hist',{method:'POST',body:JSON.stringify([{month:'_rev',data:S.rev}])})),700)}
 else if(e.target.id==='apr'){const i=S.items.find(x=>x.id===aid),v=+e.target.value;$('#apd').textContent=i&&i.cost>0&&v?'與目前單價 $'+i.cost+' 相比 '+((v-i.cost)/i.cost*100>=0?'+':'')+((v-i.cost)/i.cost*100).toFixed(1)+'%':''}
 else if(e.target.id==='aq'){const i=S.items.find(x=>x.id===aid),v=+e.target.value||0;$('#apv').textContent=v?`加入後 ${Math.round((i.qty+v)*100)/100}　／　扣除後 ${Math.max(0,Math.round((i.qty-v)*100)/100)}`:''}
 else if(e.target.id==='ps'){ps=e.target.value.trim();$('#plist').innerHTML=priceList()}
 else if(e.target.id==='os'){os=e.target.value.trim();$('#olist').innerHTML=ordList()}
 else if(e.target.closest('.st')){const row=e.target.closest('.row');const i=S.items.find(x=>x.id===row.dataset.id);i.qty=+e.target.value||0;upd(row)}
 else if(e.target.id==='mm'&&e.target.value){cur=e.target.value;header()}
});
document.addEventListener('change',e=>{if(e.target.id==='e_c'||e.target.id==='e_l'){const x=$(e.target.id==='e_c'?'#e_cn':'#e_ln'),n=e.target.value==='__new';x.style.display=n?'block':'none';if(n)x.focus()}});
$('#md').addEventListener('click',e=>{if(e.target.id==='md')$('#md').classList.remove('on')});
if(STAFF)document.title='呷歸岡 現場盤點表';
init();
</script></body></html>
